# CodeQuest CI. Uses only the repository's free Actions quota; no cloud credentials are needed
# (the Vercel Sandbox gate, `npm run runner:check`, stays an owner-run step).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    name: Supabase migrations, authorization, backup and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:lint
      - run: npm run test:integration
      - run: npm run db:verify-backup
      - run: npm run db:env
      # Browser tests run real Java through the local Docker runner.
      - run: npm run runner:docker-build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser-test traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  runner:
    name: Runner image and local proof gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Builds from checksum-verified artifacts and runs the contract runner's JUnit tests.
      - run: npm run runner:docker-build
      - run: npm run runner:local
      # Every reference solution passes its contract; every starter compiles but doesn't pass.
      - run: npm run content:check
