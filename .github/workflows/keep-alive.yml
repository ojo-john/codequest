# Free Supabase projects pause after about a week without activity, which takes the live site's
# signed-in pages down. This reads one public row through the API every three days so the
# project stays awake. It uses the publishable (anon) key, the same key every browser receives,
# never the database password.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row through the Supabase API
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the SUPABASE_URL variable and SUPABASE_PUBLISHABLE_KEY secret"
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/worlds?select=id&limit=1")
          echo "Supabase answered $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase answered $status; the project may be paused. Restore it in the dashboard."
            exit 1
          fi
